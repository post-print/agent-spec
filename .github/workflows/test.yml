name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile
      - run: bun run validate:ci
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:sandbox-safe
      - run: bun run build
      - run: bun run test:sdk:contracts
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  node-esm-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Installed package contract on Node 22
        run: bun run test:sdk:consumer

      - name: Node can import published harness ESM
        run: node -e "import('@post-print/agent-harness').then(() => console.log('harness ok'))"

      - name: Node can import published agent-test ESM
        run: node -e "import('@post-print/agent-test').then(() => console.log('agent-test ok'))"

      - name: Node can discover TypeScript tests via package bin symlink
        run: |
          mkdir -p node_modules/.bin
          chmod +x packages/test/dist/cli.js
          ln -sfn ../@post-print/agent-test/dist/cli.js node_modules/.bin/agent-test
          node_modules/.bin/agent-test test --list

      - name: Node can discover the capability suite
        run: node packages/test/dist/cli.js test test-sdk-capabilities --list

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit
      - name: Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/gitleaks" detect --source . --redact --no-banner
