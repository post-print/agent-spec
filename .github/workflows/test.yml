name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - run: bun install --frozen-lockfile
      - run: bun run validate:ci
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run test:sandbox-safe
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  node-esm-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Installed package contract on Node 22
        run: bun run test:sdk:consumer

      - name: Node can import published harness ESM
        run: node -e "import('@post-print/agent-harness').then(() => console.log('harness ok'))"

      - name: Node can import published agent-test ESM
        run: node -e "import('@post-print/agent-test').then(() => console.log('agent-test ok'))"

      - name: Node can check suite JSON via package bin symlink
        run: |
          mkdir -p node_modules/.bin
          chmod +x packages/test/dist/cli.js
          ln -sfn ../@post-print/agent-test/dist/cli.js node_modules/.bin/agent-test
          node_modules/.bin/agent-test --check --suites-dir packages/test/fixtures --suite smoke

      - name: Node can check all in-repo suites
        run: node packages/test/dist/cli.js --check --suites-dir agent-suites

  host:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Decide whether to run host suites
        id: host
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -n "$CURSOR_API_KEY" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "CURSOR_API_KEY is unset. Skip host suites."
          fi

      - if: steps.host.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - if: steps.host.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - if: steps.host.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - if: steps.host.outputs.run == 'true'
        run: bun install --frozen-lockfile

      - if: steps.host.outputs.run == 'true'
        run: bun run build

      - name: Cursor confidence gate
        if: steps.host.outputs.run == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: bun run test:confidence -- --auth-mode api-key

      - name: Cursor direct SDK smoke
        if: steps.host.outputs.run == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_AUTH_MODE: api-key
        run: bun run test:sdk:hosts -- --host cursor

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit
      - name: Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.24.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/gitleaks" detect --source . --redact --no-banner
